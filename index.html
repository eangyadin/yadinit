<!DOCTYPE html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>តេស្តកញ្ចប់អំណាន - អ៊ាង យ៉ាឌីន ICTព្រៃវែង</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- MQTT Broker សម្រាប់ Sync Realtime -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <!-- Confetti / Fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
      body {
        font-family: 'Kantumruy Pro', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
        -webkit-tap-highlight-color: transparent;
      }
      @keyframes pulse-timer {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      .timer-warn {
        animation: pulse-timer 0.6s infinite;
        color: #ef4444 !important;
      }

      /* Animations សម្រាប់ Podium និង Reveal */
      @keyframes popIn {
        0% { transform: scale(0.3) translateY(60px); opacity: 0; }
        70% { transform: scale(1.08) translateY(-8px); opacity: 1; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }
      @keyframes glowGold {
        0%, 100% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.4), inset 0 0 15px rgba(254, 240, 138, 0.5); }
        50% { box-shadow: 0 0 45px rgba(245, 158, 11, 0.8), inset 0 0 25px rgba(254, 240, 138, 0.8); }
      }
      .animate-pop-in {
        animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .gold-podium-glow {
        animation: glowGold 2s infinite ease-in-out;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const MQTT_TOPIC = "ict_preyveng_quiz_sync_live_v3";
      const MQTT_BROKER = "wss://broker.emqx.io:8084/mqtt";

      const getKhmerDateTime = () => {
        const now = new Date();
        const days = ['អាទិត្យ', 'ច័ន្ទ', 'អង្គារ', 'ពុធ', 'ព្រហស្បតិ៍', 'សុក្រ', 'សៅរ៍'];
        const months = ['មករា', 'កុម្ភៈ', 'មីនា', 'មេសា', 'ឧសភា', 'មិថុនា', 'កក្កដា', 'សីហា', 'កញ្ញា', 'តុលា', 'វិច្ឆិកា', 'ធ្នូ'];
        const toKhmerNum = (num) => {
          const khNums = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
          return num.toString().split('').map(d => khNums[d] !== undefined ? khNums[d] : d).join('');
        };

        const dayName = days[now.getDay()];
        const date = toKhmerNum(now.getDate());
        const monthName = months[now.getMonth()];
        const year = toKhmerNum(now.getFullYear());
        
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const period = hours >= 12 ? 'រសៀល' : 'ព្រឹក';
        if (hours > 12) hours -= 12;
        if (hours === 0) hours = 12;

        return {
          fullDate: `ថ្ងៃ${dayName} ទី${date} ខែ${monthName} ឆ្នាំ${year}`,
          shortDate: `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')}`,
          time: `${toKhmerNum(hours)}:${toKhmerNum(minutes)} ${period}`
        };
      };

      const playSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (type === 'tick') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.04);
          } else if (type === 'correct') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16);
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
            osc.start();
            osc.stop(ctx.currentTime + 0.35);
          } else if (type === 'wrong') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(240, ctx.currentTime);
            osc.frequency.setValueAtTime(160, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
          } else if (type === 'drumroll') {
            // សំឡេងស្គររោទ៍រង់ចាំប្រកាស
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, ctx.currentTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.9);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.9);
          } else if (type === 'victory') {
            const notes = [
              { f: 523.25, d: 0.15, t: 0 },
              { f: 523.25, d: 0.15, t: 0.15 },
              { f: 523.25, d: 0.15, t: 0.3 },
              { f: 659.25, d: 0.45, t: 0.45 },
              { f: 523.25, d: 0.15, t: 0.95 },
              { f: 659.25, d: 0.15, t: 1.1 },
              { f: 783.99, d: 0.7, t: 1.25 },
              { f: 659.25, d: 0.2, t: 2.0 },
              { f: 783.99, d: 0.2, t: 2.2 },
              { f: 1046.50, d: 1.4, t: 2.4 }
            ];
            notes.forEach((item) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(item.f, ctx.currentTime + item.t);
              gain.gain.setValueAtTime(0.35, ctx.currentTime + item.t);
              gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + item.t + item.d);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(ctx.currentTime + item.t);
              osc.stop(ctx.currentTime + item.t + item.d);
            });
          }
        } catch (e) {}
      };

      const triggerGrandFireworks = () => {
        playSound('victory');
        const duration = 5 * 1000;
        const animationEnd = Date.now() + duration;
        const defaults = { startVelocity: 45, spread: 360, ticks: 100, zIndex: 1000 };
        const randomInRange = (min, max) => Math.random() * (max - min) + min;

        const interval = setInterval(() => {
          const timeLeft = animationEnd - Date.now();
          if (timeLeft <= 0) return clearInterval(interval);
          const particleCount = 80 * (timeLeft / duration);
          confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
          confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
        }, 220);
      };

      const shuffleArray = (arr) => {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      const DEFAULT_QUESTIONS = [
        {
          id: 1,
          question: 'តើសំណួរប្រភេទណាដែលគ្រូបង្រៀនសួរទៅកាន់សិស្ស មុនពេលចាប់ផ្តើមអានអត្ថបទ ដើម្បីរំញោចការគិត និងទាក់ទាញចំណាប់អារម្មណ៍?',
          options: ['សំណួរបំពេញចន្លោះ', 'សំណួរទស្សន៍ទាយ', 'សំណួរសង្ខេប', 'សំណួរវិភាគវេយ្យាករណ៍'],
          answer: 'សំណួរទស្សន៍ទាយ'
        },
        {
          id: 2,
          question: 'ការឱ្យសិស្សឆ្លើយសំណួរអំពីមូលហេតុ អត្ថន័យបង្កប់ ឬព័ត៌មានលម្អិតដែលមាននៅក្នុងអត្ថបទ ត្រូវបានចាត់ចូលក្នុងយុទ្ធវិធីអ្វី?',
          options: ['សំណួរយល់ន័យ', 'ការប្រើក្រាហ្វិក', 'ការសង្ខេបអត្ថបទ', 'ការស្វែងរកតួ'],
          answer: 'សំណួរយល់ន័យ'
        }
      ];

      function App() {
        const checkIsTeacher = () => {
          const hash = window.location.hash;
          const params = new URLSearchParams(window.location.search);
          return hash === '#admin' || params.get('role') === 'teacher' || params.get('role') === 'admin';
        };

        const [isTeacher, setIsTeacher] = useState(checkIsTeacher);
        const [adminPassInput, setAdminPassInput] = useState('');
        const [currentPin, setCurrentPin] = useState(() => localStorage.getItem('quiz_teacher_pin') || '1234');
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [adminTab, setAdminTab] = useState('podium');
        const [hideHeader, setHideHeader] = useState(false);
        const [isDark, setIsDark] = useState(() => localStorage.getItem('quiz_theme') !== 'light');
        const [appTitle, setAppTitle] = useState(() => localStorage.getItem('quiz_app_title') || 'តេស្តកញ្ចប់អំណានថ្នាក់ទី១,២,៣');

        const [liveDate, setLiveDate] = useState(getKhmerDateTime());

        useEffect(() => {
          const timer = setInterval(() => setLiveDate(getKhmerDateTime()), 10000);
          return () => clearInterval(timer);
        }, []);

        const [activeQuestions, setActiveQuestions] = useState(() => {
          try {
            const saved = localStorage.getItem('active_quiz_questions');
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch (e) {}
          return DEFAULT_QUESTIONS;
        });

        const [editingQuestions, setEditingQuestions] = useState(() => activeQuestions);
        
        const [leaderboard, setLeaderboard] = useState(() => {
          try {
            const saved = localStorage.getItem('kahoot_board');
            return saved ? JSON.parse(saved) : [];
          } catch (e) { return []; }
        });

        const [historyList, setHistoryList] = useState(() => {
          try {
            const saved = localStorage.getItem('kahoot_history_archives');
            return saved ? JSON.parse(saved) : [];
          } catch (e) { return []; }
        });

        // ដំណាក់កាលប្រកាសអ្នកឈ្នះ (0=លាក់, 1=បង្ហាញលេខ៣, 2=បង្ហាញលេខ២, 3=បង្ហាញលេខ១ ពេញលេញ)
        const [podiumRevealStep, setPodiumRevealStep] = useState(0);
        const [isRevealing, setIsRevealing] = useState(false);

        const [showImportModal, setShowImportModal] = useState(false);
        const [showPinModal, setShowPinModal] = useState(false);
        const [showHistoryModal, setShowHistoryModal] = useState(false);

        const [bulkText, setBulkText] = useState('');
        const [oldPinInput, setOldPinInput] = useState('');
        const [newPinInput, setNewPinInput] = useState('');
        const [confirmPinInput, setConfirmPinInput] = useState('');

        const [cloudStatus, setCloudStatus] = useState('កំពុងភ្ជាប់...');
        const mqttClientRef = useRef(null);

        const [userName, setUserName] = useState('');
        const [started, setStarted] = useState(false);
        const [shuffledQuestions, setShuffledQuestions] = useState([]);
        const [currentQ, setCurrentQ] = useState(0);
        const [score, setScore] = useState(0);
        const [timeLeft, setTimeLeft] = useState(20);
        const [answered, setAnswered] = useState(false);
        const [selectedOpt, setSelectedOpt] = useState(null);
        const [totalTimeSpent, setTotalTimeSpent] = useState(0);

        const sortLeaderboard = (list) => {
          return [...list].sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            return a.timeSpent - b.timeSpent;
          });
        };

        useEffect(() => {
          const clientId = "quiz_dev_" + Math.random().toString(16).substring(2, 9);
          const client = mqtt.connect(MQTT_BROKER, {
            clientId: clientId,
            clean: true,
            connectTimeout: 5000,
            reconnectPeriod: 2000,
          });

          mqttClientRef.current = client;

          client.on("connect", () => {
            setCloudStatus("Cloud Sync ជាប់");
            client.subscribe(MQTT_TOPIC);
            client.publish(MQTT_TOPIC, JSON.stringify({ type: "REQ_LATEST_QUIZ" }));
          });

          client.on("message", (topic, message) => {
            try {
              const packet = JSON.parse(message.toString());
              if (packet.type === "NEW_SCORE") {
                setLeaderboard((prev) => {
                  const filtered = prev.filter((p) => p.id !== packet.payload.id);
                  const updated = sortLeaderboard([...filtered, packet.payload]);
                  localStorage.setItem("kahoot_board", JSON.stringify(updated));
                  return updated;
                });
              } else if (packet.type === "CLEAR_SCORES") {
                setLeaderboard([]);
                setPodiumRevealStep(0);
                localStorage.removeItem("kahoot_board");
              } else if (packet.type === "SET_QUESTIONS") {
                setActiveQuestions(packet.payload);
                setEditingQuestions(packet.payload);
                localStorage.setItem("active_quiz_questions", JSON.stringify(packet.payload));
              } else if (packet.type === "SET_TITLE") {
                setAppTitle(packet.payload);
                localStorage.setItem("quiz_app_title", packet.payload);
              } else if (packet.type === "REQ_LATEST_QUIZ") {
                const saved = localStorage.getItem("active_quiz_questions");
                if (saved) {
                  client.publish(MQTT_TOPIC, JSON.stringify({ type: "SET_QUESTIONS", payload: JSON.parse(saved) }));
                }
              }
            } catch (e) {}
          });

          const handleHash = () => setIsTeacher(checkIsTeacher());
          window.addEventListener("hashchange", handleHash);
          const handleKey = (e) => { if (e.key === "Escape") setHideHeader((p) => !p); };
          window.addEventListener("keydown", handleKey);

          return () => {
            if (client) client.end();
            window.removeEventListener("hashchange", handleHash);
            window.removeEventListener("keydown", handleKey);
          };
        }, []);

        const sendMqttMessage = (type, payload) => {
          if (mqttClientRef.current && mqttClientRef.current.connected) {
            mqttClientRef.current.publish(MQTT_TOPIC, JSON.stringify({ type, payload }));
          }
        };

        const toggleTheme = () => {
          const nextTheme = !isDark;
          setIsDark(nextTheme);
          localStorage.setItem("quiz_theme", nextTheme ? "dark" : "light");
        };

        const handleLoginAdmin = () => {
          if (adminPassInput === currentPin) {
            setIsLoggedIn(true);
            setAdminPassInput('');
          } else {
            alert("លេខសម្ងាត់មិនត្រឹមត្រូវទេ!");
          }
        };

        const handleLogoutAdmin = () => {
          setIsLoggedIn(false);
          setIsTeacher(false);
          window.location.hash = "";
        };

        // មុខងារប្រកាសជ័យលាភី Top 3 តាមលំដាប់លំដោយរំភើបអស្ចារ្យ
        const handleTriggerReveal = () => {
          if (leaderboard.length < 3) {
            return alert(`ត្រូវការសិស្សយ៉ាងហោចណាស់ ៣ នាក់ដើម្បីប្រកាសជ័យលាភី! (បច្ចុប្បន្នទើបមាន ${leaderboard.length} នាក់)`);
          }

          setIsRevealing(true);
          setPodiumRevealStep(0);

          // ជំហានទី ១៖ បង្ហាញលេខ ៣ (ក្រោយ ២ វិនាទី)
          playSound('drumroll');
          setTimeout(() => {
            setPodiumRevealStep(1);
            playSound('correct');
          }, 1800);

          // ជំហានទី ២៖ បង្ហាញលេខ ២ (ក្រោយ ៤ វិនាទី)
          setTimeout(() => {
            setPodiumRevealStep(2);
            playSound('correct');
          }, 3800);

          // ជំហានទី ៣៖ បង្ហាញលេខ ១ ជើងឯក + កាំជ្រួចធំ + ភ្លេងជ័យជម្នះ (ក្រោយ ៦ វិនាទី)
          setTimeout(() => {
            setPodiumRevealStep(3);
            setIsRevealing(false);
            triggerGrandFireworks();
          }, 6000);
        };

        const handleChangePin = () => {
          if (oldPinInput !== currentPin) return alert("លេខសម្ងាត់ចាស់មិនត្រឹមត្រូវទេ!");
          if (!newPinInput.trim() || newPinInput.length < 4) return alert("លេខសម្ងាត់ថ្មីត្រូវមានយ៉ាងតិច ៤ ខ្ទង់ឡើងទៅ!");
          if (newPinInput !== confirmPinInput) return alert("ការផ្ទៀងផ្ទាត់លេខសម្ងាត់ថ្មីមិនត្រូវគ្នាទេ!");

          setCurrentPin(newPinInput);
          localStorage.setItem('quiz_teacher_pin', newPinInput);
          setShowPinModal(false);
          setOldPinInput('');
          setNewPinInput('');
          setConfirmPinInput('');
          alert("ជោគជ័យ! លេខសម្ងាត់ថ្មីត្រូវបានរក្សាទុក!");
        };

        const handleTitleChange = (newTitle) => {
          setAppTitle(newTitle);
          localStorage.setItem("quiz_app_title", newTitle);
          sendMqttMessage("SET_TITLE", newTitle);
        };

        const handleStartNewRound = () => {
          if (leaderboard.length === 0) {
            return alert("មិនទាន់មានលទ្ធផលក្នុងជុំនេះសម្រាប់រក្សាទុកនៅឡើយទេ!");
          }

          if (confirm(`តើអ្នកពិតជាចង់រក្សាទុកលទ្ធផលអ្នកចូលរួមទាំង ${leaderboard.length} នាក់នេះ ចូលក្នុងប្រវត្តិ ហើយចាប់ផ្តើមជុំថ្មីមែនទេ?`)) {
            const newArchiveItem = {
              id: Date.now(),
              title: appTitle,
              date: liveDate.fullDate,
              time: liveDate.time,
              shortDate: liveDate.shortDate,
              totalParticipants: leaderboard.length,
              top1: leaderboard[0] ? leaderboard[0].name : "គ្មាន",
              data: [...leaderboard]
            };

            const updatedHistory = [newArchiveItem, ...historyList];
            setHistoryList(updatedHistory);
            localStorage.setItem('kahoot_history_archives', JSON.stringify(updatedHistory));

            setLeaderboard([]);
            setPodiumRevealStep(0);
            localStorage.removeItem('kahoot_board');
            sendMqttMessage("CLEAR_SCORES", {});

            alert("ជោគជ័យ! ទិន្នន័យជុំចាស់ត្រូវបានកត់ត្រាទុកក្នុងប្រវត្តិកម្រងរួចរាល់។");
          }
        };

        const exportTableToExcel = (dataList, customTitle, dateString) => {
          if (!dataList || dataList.length === 0) return alert("គ្មានទិន្នន័យសម្រាប់ទាញយកទេ!");

          let csvContent = "\uFEFF";
          csvContent += `របាយការណ៍លទ្ធផល៖ ${customTitle}\n`;
          csvContent += `កាលបរិច្ឆេទ៖ ${dateString || liveDate.fullDate}\n`;
          csvContent += `រៀបចំដោយ៖ អ៊ាង យ៉ាឌីន ICTព្រៃវែង\n\n`;
          csvContent += "ចំណាត់ថ្នាក់,ឈ្មោះសិស្ស,ពិន្ទុ (Score),រយៈពេលឆ្លើយ (វិនាទី),ម៉ោងឆ្លើយចប់,កាលបរិច្ឆេទ\n";

          dataList.forEach((item, index) => {
            const rank = index + 1;
            const name = `"${item.name.replace(/"/g, '""')}"`;
            const scoreVal = item.score;
            const timeSpent = item.timeSpent;
            const timeSub = `"${item.submittedTime || liveDate.time}"`;
            const dateSub = `"${item.submittedDate || liveDate.shortDate}"`;

            csvContent += `${rank},${name},${scoreVal},${timeSpent},${timeSub},${dateSub}\n`;
          });

          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.setAttribute("href", url);
          link.setAttribute("download", `លទ្ធផល_${customTitle}_${liveDate.shortDate}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        };

        const handleAddNewQuestion = () => {
          const newQ = {
            id: Date.now(),
            question: `សំណួរទី ${editingQuestions.length + 1}៖ ...`,
            options: ["ជម្រើសទី ១", "ជម្រើសទី ២", "ជម្រើសទី ៣", "ជម្រើសទី ៤"],
            answer: "ជម្រើសទី ១",
          };
          setEditingQuestions([...editingQuestions, newQ]);
        };

        const handleDeleteQuestion = (qIndex) => {
          if (editingQuestions.length <= 1) return alert("កម្រងសំណួរត្រូវមានយ៉ាងហោចណាស់ ១ សំណួរ!");
          if (confirm("តើអ្នកពិតជាចង់លុបសំណួរនេះមែនទេ?")) {
            setEditingQuestions(editingQuestions.filter((_, idx) => idx !== qIndex));
          }
        };

        const handleQuestionChange = (qIndex, value) => {
          const updated = [...editingQuestions];
          updated[qIndex].question = value;
          setEditingQuestions(updated);
        };

        const handleOptionChange = (qIndex, optIndex, value) => {
          const updated = [...editingQuestions];
          const oldVal = updated[qIndex].options[optIndex];
          updated[qIndex].options[optIndex] = value;
          if (updated[qIndex].answer === oldVal) updated[qIndex].answer = value;
          setEditingQuestions(updated);
        };

        const handleSetCorrectAnswer = (qIndex, optionValue) => {
          const updated = [...editingQuestions];
          updated[qIndex].answer = optionValue;
          setEditingQuestions(updated);
        };

        const handleExportToWord = () => {
          if (editingQuestions.length === 0) return alert("គ្មានសំណួរសម្រាប់ទាញយកទេ!");

          let htmlContent = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head>
              <meta charset='utf-8'>
              <title>${appTitle}</title>
              <style>
                body { font-family: 'Kantumruy Pro', 'Khmer OS Siemreap', Arial, sans-serif; line-height: 1.6; }
                h2 { text-align: center; color: #1e3a8a; margin-bottom: 2px; }
                .meta { text-align: center; font-size: 11pt; color: #4b5563; margin-bottom: 20px; }
                .q-item { margin-bottom: 18px; }
                .q-title { font-weight: bold; font-size: 13pt; }
                .opt-list { margin-left: 20px; }
                .correct { color: #047857; font-weight: bold; }
              </style>
            </head>
            <body>
              <h2>កម្រងសំណួរ៖ ${appTitle}</h2>
              <div class="meta">
                📅 កាលបរិច្ឆេទ៖ ${liveDate.fullDate}<br/>
                ✍️ រៀបចំដោយ៖ អ៊ាង យ៉ាឌីន ICTព្រៃវែង | សរុប ${editingQuestions.length} សំណួរ
              </div>
              <hr/>
          `;

          editingQuestions.forEach((q, idx) => {
            htmlContent += `
              <div class="q-item">
                <div class="q-title">សំណួរទី ${idx + 1}៖ ${q.question}</div>
                <div class="opt-list">
                  ${q.options.map((opt, oIdx) => {
                    const khLetters = ['ក', 'ខ', 'គ', 'ឃ'];
                    const isAns = opt === q.answer;
                    return `<p class="${isAns ? 'correct' : ''}">${khLetters[oIdx]}. ${opt} ${isAns ? ' (✓ ចម្លើយត្រឹមត្រូវ)' : ''}</p>`;
                  }).join('')}
                </div>
              </div>
            `;
          });

          htmlContent += `</body></html>`;

          const blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `${appTitle}_${liveDate.shortDate}.doc`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        };

        const handleProcessBulkImport = () => {
          if (!bulkText.trim()) return alert("សូមបិទភ្ជាប់ (Paste) អត្ថបទសំណួររបស់អ្នកជាមុនសិន!");

          const lines = bulkText.split("\n").map(l => l.trim()).filter(l => l.length > 0);
          const parsed = [];
          let currentItem = null;

          lines.forEach(line => {
            const isQuestion = /^(សំណួរ|\d+[\.\)\:\-]|Question)/i.test(line) || (!currentItem && line.endsWith("?"));
            if (isQuestion || (currentItem && currentItem.options.length >= 4)) {
              if (currentItem && currentItem.options.length >= 2) {
                parsed.push(currentItem);
              }
              const cleanQ = line.replace(/^(សំណួរ\s*\d*[\.\:\-]*|\d+[\.\)\:\-]*)\s*/i, "").trim();
              currentItem = { id: Date.now() + Math.random(), question: cleanQ || line, options: [], answer: "" };
            } else if (currentItem) {
              const cleanOpt = line.replace(/^([a-dA-Dក-ឃ១-៤][\.\)\:\-]|[-*•])\s*/i, "").trim();
              if (cleanOpt) {
                currentItem.options.push(cleanOpt);
                if (!currentItem.answer) currentItem.answer = cleanOpt;
              }
            }
          });

          if (currentItem && currentItem.options.length >= 2) parsed.push(currentItem);
          if (parsed.length === 0) return alert("ប្រព័ន្ធរកមិនឃើញទម្រង់សំណួរត្រឹមត្រូវទេ!");

          setEditingQuestions(parsed);
          setShowImportModal(false);
          setBulkText('');
          alert(`ជោគជ័យ! បានទាញយកសំណួរចំនួន ${parsed.length} សំណួររួចរាល់។`);
        };

        const handleSaveAndActivate = () => {
          setActiveQuestions(editingQuestions);
          localStorage.setItem("active_quiz_questions", JSON.stringify(editingQuestions));
          sendMqttMessage("SET_QUESTIONS", editingQuestions);
          alert(`ជោគជ័យ! សំណួរទាំង ${editingQuestions.length} ត្រូវបានផ្សាយឡើង Cloud រួចរាល់។`);
          setAdminTab("podium");
        };

        const startStudentGame = () => {
          if (!userName.trim()) return;
          const currentActive = activeQuestions.length > 0 ? activeQuestions : DEFAULT_QUESTIONS;
          const randomized = shuffleArray(currentActive).map((q) => ({
            ...q,
            options: shuffleArray(q.options),
          }));
          setShuffledQuestions(randomized);
          setStarted(true);
          setTimeLeft(20);
          setTotalTimeSpent(0);
        };

        useEffect(() => {
          if (!started || answered || currentQ >= shuffledQuestions.length) return;
          if (timeLeft === 0) {
            setAnswered(true);
            playSound("wrong");
            setTotalTimeSpent((prev) => prev + 20);
            setTimeout(() => nextQuestion(score, totalTimeSpent + 20), 1200);
            return;
          }
          const timer = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 5) playSound("tick");
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(timer);
        }, [started, timeLeft, answered, currentQ, shuffledQuestions]);

        const handleAnswer = (optionText) => {
          if (answered) return;
          setAnswered(true);
          setSelectedOpt(optionText);

          const timeUsed = 20 - timeLeft;
          const newTotalTime = totalTimeSpent + timeUsed;
          setTotalTimeSpent(newTotalTime);

          let added = 0;
          if (optionText === shuffledQuestions[currentQ].answer) {
            playSound("correct");
            added = 10;
          } else {
            playSound("wrong");
          }

          const newScore = score + added;
          setScore(newScore);
          setTimeout(() => nextQuestion(newScore, newTotalTime), 1200);
        };

        const nextQuestion = (finalScore, finalTotalTime) => {
          setAnswered(false);
          setSelectedOpt(null);
          setTimeLeft(20);

          if (currentQ + 1 < shuffledQuestions.length) {
            setCurrentQ((prev) => prev + 1);
          } else {
            setCurrentQ(shuffledQuestions.length);

            const curDateInfo = getKhmerDateTime();
            const playerData = {
              id: Date.now() + "_" + Math.random().toString(36).substring(2, 6),
              name: userName,
              score: finalScore,
              timeSpent: finalTotalTime,
              submittedTime: curDateInfo.time,
              submittedDate: curDateInfo.shortDate
            };

            sendMqttMessage("NEW_SCORE", playerData);
          }
        };

        const kahootColors = [
          { bg: "bg-red-600 hover:bg-red-500", border: "border-red-700", shape: "▲" },
          { bg: "bg-blue-600 hover:bg-blue-500", border: "border-blue-700", shape: "◆" },
          { bg: "bg-amber-500 hover:bg-amber-400", border: "border-amber-600", shape: "●" },
          { bg: "bg-emerald-600 hover:bg-emerald-500", border: "border-emerald-700", shape: "■" },
        ];

        const themeBg = isDark ? "bg-[#0b0f19] text-white" : "bg-slate-50 text-slate-800";
        const cardBg = isDark ? "bg-slate-900/90 border-slate-800" : "bg-white border-slate-200 shadow-sm";
        const subText = isDark ? "text-slate-400" : "text-slate-500";
        const inputBg = isDark ? "bg-slate-950 border-slate-800 text-white" : "bg-slate-100 border-slate-300 text-slate-900";

        // =========================================================================
        // ផ្ទាំងគ្រូ (TEACHER / PROJECTOR VIEW)
        // =========================================================================
        if (isTeacher) {
          if (!isLoggedIn) {
            return (
              <div className={`flex items-center justify-center min-h-screen p-4 ${themeBg}`}>
                <div className={`p-8 rounded-3xl border max-w-sm w-full text-center shadow-2xl ${cardBg}`}>
                  <div className="text-5xl mb-4">🔐</div>
                  <h2 className="text-xl font-bold mb-2">ចូលផ្ទាំងគ្រូបង្រៀន</h2>
                  <p className={`text-xs mb-6 ${subText}`}>សូមវាយលេខកូដសម្ងាត់ផ្ទាល់ខ្លួន</p>
                  <input
                    type="password"
                    placeholder="••••••••"
                    value={adminPassInput}
                    onChange={(e) => setAdminPassInput(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && handleLoginAdmin()}
                    className={`w-full border rounded-xl p-3 text-center mb-4 focus:outline-none focus:border-purple-500 tracking-widest text-lg ${inputBg}`}
                  />
                  <button
                    onClick={handleLoginAdmin}
                    className="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-bold transition shadow-lg mb-3"
                  >
                    ចូលប្រព័ន្ធ
                  </button>
                  <button
                    onClick={() => { setIsTeacher(false); window.location.hash = ""; }}
                    className="text-xs text-slate-400 hover:underline"
                  >
                    ← ត្រឡប់ទៅផ្ទាំងសិស្ស
                  </button>
                </div>
              </div>
            );
          }

          const top1 = leaderboard[0];
          const top2 = leaderboard[1];
          const top3 = leaderboard[2];

          return (
            <div className={`min-h-screen p-3 md:p-6 flex flex-col justify-between relative ${themeBg}`}>
              {hideHeader && (
                <div className="fixed top-4 right-4 z-50 flex items-center gap-2">
                  <button
                    onClick={toggleTheme}
                    className="bg-slate-800/80 hover:bg-slate-700 text-amber-300 border border-slate-700 p-2 rounded-2xl shadow-xl backdrop-blur-md transition"
                  >
                    {isDark ? "☀️" : "🌙"}
                  </button>
                  <button
                    onClick={() => setHideHeader(false)}
                    className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2 rounded-2xl shadow-2xl border border-purple-400/40 transition flex items-center gap-2 text-xs"
                  >
                    ⚙️ បង្ហាញផ្ទាំងគ្រប់គ្រង
                  </button>
                </div>
              )}

              {!hideHeader && (
                <header className={`max-w-5xl mx-auto w-full flex flex-wrap gap-4 justify-between items-center border p-4 rounded-2xl mb-6 shadow-xl ${cardBg}`}>
                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      onClick={() => setAdminTab("podium")}
                      className={`px-4 py-2 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 ${
                        adminTab === "podium" ? "bg-amber-500 text-slate-950 shadow-md" : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                      }`}
                    >
                      🏆 ផ្ទាំងមើលពាន (Projector Display)
                    </button>
                    <button
                      onClick={() => setAdminTab("questions")}
                      className={`px-4 py-2 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 ${
                        adminTab === "questions" ? "bg-purple-600 text-white shadow-md" : "bg-slate-800 text-slate-300 hover:bg-slate-700"
                      }`}
                    >
                      ⚙️ ផ្ទាំងកែសំណួរ ({editingQuestions.length})
                    </button>
                    
                    <button
                      onClick={() => setShowHistoryModal(true)}
                      className="bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
                    >
                      📜 ប្រវត្តិប្រកួត ({historyList.length})
                    </button>
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="flex items-center gap-1.5 text-[11px] px-3 py-1 rounded-full bg-emerald-950/60 border border-emerald-800/80 text-emerald-400 font-semibold">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                      {cloudStatus}
                    </span>
                    
                    <button
                      onClick={() => setShowPinModal(true)}
                      className="bg-purple-600/20 hover:bg-purple-600/40 text-purple-300 border border-purple-500/30 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1"
                      title="ប្តូរលេខសម្ងាត់សម្រាប់ចូលផ្ទាំងគ្រូ"
                    >
                      🔐 ប្តូរលេខកូដ
                    </button>

                    <button
                      onClick={toggleTheme}
                      className={`p-2 rounded-xl border text-sm transition ${
                        isDark ? "bg-slate-800 border-slate-700 text-amber-300" : "bg-slate-100 border-slate-300 text-slate-700"
                      }`}
                    >
                      {isDark ? "☀️" : "🌙"}
                    </button>
                    <button
                      onClick={() => setHideHeader(true)}
                      className="bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/40 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
                    >
                      👁️‍🗨️ លាក់របារ
                    </button>
                    
                    <button
                      onClick={handleStartNewRound}
                      className="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-2 rounded-xl text-xs shadow-md transition flex items-center gap-1"
                      title="រក្សាទុកទិន្នន័យជុំនេះទុកក្នុងប្រវត្តិ ហើយចាប់ផ្តើមជុំថ្មី"
                    >
                      🔄 ចាប់ផ្តើមជុំថ្មី
                    </button>

                    <button
                      onClick={handleLogoutAdmin}
                      className="bg-slate-800 text-slate-300 px-3 py-2 rounded-xl text-xs hover:bg-slate-700 transition"
                    >
                      ចាកចេញ
                    </button>
                  </div>
                </header>
              )}

              {adminTab === "podium" && (
                <div className={`max-w-5xl mx-auto w-full ${hideHeader ? "pt-4" : ""}`}>
                  <div className="text-center mb-6">
                    <h1 className="text-2xl md:text-3xl font-black text-amber-400 uppercase tracking-widest drop-shadow-md">
                      🏆 {appTitle}
                    </h1>

                    <div className="inline-flex items-center gap-2 mt-2 px-4 py-1.5 bg-amber-500/10 border border-amber-500/30 rounded-full text-xs text-amber-300 font-semibold shadow-sm">
                      <span>📅 {liveDate.fullDate}</span>
                    </div>

                    {/* ប៊ូតុងរំភើបអស្ចារ្យ សម្រាប់គ្រូចុចប្រកាសអ្នកឈ្នះ Top 3 ពេលសិស្សធ្វើចប់គ្រប់គ្នា */}
                    <div className="mt-4">
                      {podiumRevealStep < 3 ? (
                        <button
                          onClick={handleTriggerReveal}
                          disabled={isRevealing || leaderboard.length < 3}
                          className={`px-6 py-3 rounded-2xl font-black text-sm transition-all shadow-xl flex items-center gap-2 mx-auto ${
                            leaderboard.length >= 3 && !isRevealing
                              ? "bg-gradient-to-r from-amber-500 via-orange-500 to-pink-500 hover:from-amber-400 hover:to-pink-400 text-slate-950 scale-105 animate-bounce"
                              : "bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed"
                          }`}
                        >
                          <span>{isRevealing ? "🥁 កំពុងរៀបចំប្រកាស..." : "👑 ប្រកាសជ័យលាភី Top 3 (Reveal Podium)"}</span>
                          <span className="text-xs bg-slate-950/40 text-amber-300 px-2 py-0.5 rounded-full font-bold">
                            {leaderboard.length} នាក់បានឆ្លើយចប់
                          </span>
                        </button>
                      ) : (
                        <div className="inline-flex items-center gap-2 px-4 py-1.5 bg-emerald-500/10 border border-emerald-500/30 rounded-full text-xs text-emerald-400 font-bold animate-pulse">
                          <span>🎉 បានប្រកាសជ័យលាភីកំពូលទាំង ៣ រូបរួចរាល់!</span>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* វេទិកា PODIUM បែប ANIMATION រស់រវើក និងទាន់សម័យ */}
                  <div className="flex justify-center items-end gap-3 md:gap-6 max-w-2xl mx-auto h-64 mb-10">
                    {/* លេខ ២ (បង្ហាញនៅជំហានទី ២) */}
                    <div className="flex-1 flex flex-col items-center">
                      {podiumRevealStep >= 2 ? (
                        <div className="flex flex-col items-center animate-pop-in">
                          <div className="text-sm font-black truncate max-w-[100px] mb-1 text-slate-200">{top2?.name}</div>
                          <div className="text-xs text-slate-400 mb-0.5 font-bold">{top2?.score} ពិន្ទុ</div>
                          <div className="text-[11px] text-purple-400 font-semibold mb-2">⏱️ {top2?.timeSpent}s</div>
                        </div>
                      ) : (
                        <div className="h-14 flex items-center justify-center text-xl text-slate-600 font-black">? ? ?</div>
                      )}
                      <div className={`w-full bg-gradient-to-t from-slate-700 to-slate-500 rounded-t-2xl flex flex-col items-center justify-center border-t-4 border-slate-300 shadow-xl transition-all duration-700 ${podiumRevealStep >= 2 ? 'h-36' : 'h-24 opacity-60'}`}>
                        <span className="text-3xl">🥈</span>
                        <span className="text-xl font-black text-white mt-1">2</span>
                      </div>
                    </div>

                    {/* លេខ ១ ជើងឯក (បង្ហាញចុងក្រោយបង្អស់ ជាមួយ Glow មាស និងម្កុដរលោង) */}
                    <div className="flex-1 flex flex-col items-center">
                      {podiumRevealStep >= 3 ? (
                        <div className="flex flex-col items-center animate-pop-in">
                          <span className="text-4xl animate-bounce drop-shadow-[0_0_15px_rgba(245,158,11,0.8)]">👑</span>
                          <div className="text-base font-black text-amber-400 truncate max-w-[120px] mb-1 drop-shadow-md">{top1?.name}</div>
                          <div className="text-xs text-amber-300 font-bold mb-0.5">{top1?.score} ពិន្ទុ</div>
                          <div className="text-[11px] text-amber-200 font-bold mb-2">⏱️ {top1?.timeSpent}s</div>
                        </div>
                      ) : (
                        <div className="h-16 flex flex-col items-center justify-center text-amber-500/60 font-black">
                          <span className="text-2xl animate-pulse">👑</span>
                          <span className="text-xs mt-1">រង់ចាំជើងឯក</span>
                        </div>
                      )}
                      <div className={`w-full bg-gradient-to-t from-amber-600 to-amber-400 rounded-t-2xl flex flex-col items-center justify-center border-t-4 border-yellow-200 shadow-2xl transition-all duration-700 ${podiumRevealStep >= 3 ? 'h-48 gold-podium-glow' : 'h-28 opacity-60'}`}>
                        <span className="text-4xl">🥇</span>
                        <span className="text-2xl font-black text-slate-950 mt-1">1</span>
                      </div>
                    </div>

                    {/* លេខ ៣ (បង្ហាញមុនគេបង្អស់នៅជំហានទី ១) */}
                    <div className="flex-1 flex flex-col items-center">
                      {podiumRevealStep >= 1 ? (
                        <div className="flex flex-col items-center animate-pop-in">
                          <div className="text-sm font-black text-amber-600 truncate max-w-[100px] mb-1">{top3?.name}</div>
                          <div className="text-xs text-slate-400 mb-0.5 font-bold">{top3?.score} ពិន្ទុ</div>
                          <div className="text-[11px] text-purple-400 font-semibold mb-2">⏱️ {top3?.timeSpent}s</div>
                        </div>
                      ) : (
                        <div className="h-14 flex items-center justify-center text-xl text-slate-600 font-black">? ? ?</div>
                      )}
                      <div className={`w-full bg-gradient-to-t from-amber-900 to-amber-700 rounded-t-2xl flex flex-col items-center justify-center border-t-4 border-amber-600 shadow-lg transition-all duration-700 ${podiumRevealStep >= 1 ? 'h-28' : 'h-20 opacity-60'}`}>
                        <span className="text-3xl">🥉</span>
                        <span className="text-xl font-black text-white mt-1">3</span>
                      </div>
                    </div>
                  </div>

                  {/* តារាងលទ្ធផលសិស្សទាំងអស់ */}
                  <div className={`border rounded-2xl p-5 shadow-xl ${cardBg}`}>
                    <div className="flex flex-wrap justify-between items-center gap-3 mb-3 border-b pb-3 border-slate-800">
                      <h3 className={`text-xs font-bold uppercase tracking-wider ${subText}`}>
                        អ្នកចូលរួមជុំបច្ចុប្បន្ន ({leaderboard.length} នាក់)
                      </h3>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => exportTableToExcel(leaderboard, appTitle, liveDate.fullDate)}
                          className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3.5 py-1.5 rounded-xl text-xs shadow-md transition flex items-center gap-1.5 active:scale-95"
                        >
                          <span>📊</span>
                          <span>ទាញយកជា Excel</span>
                        </button>
                      </div>
                    </div>

                    <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                      {leaderboard.length === 0 ? (
                        <p className={`text-center py-6 text-sm ${subText}`}>មិនទាន់មានសិស្សឆ្លើយចប់ក្នុងជុំនេះនៅឡើយទេ...</p>
                      ) : (
                        leaderboard.map((item, idx) => (
                          <div
                            key={idx}
                            className={`flex justify-between items-center px-4 py-2.5 rounded-xl border text-sm ${
                              isDark ? "bg-slate-950/60 border-slate-800" : "bg-slate-50 border-slate-200"
                            }`}
                          >
                            <div className="flex items-center gap-3">
                              <span className={`font-bold w-6 ${subText}`}>#{idx + 1}</span>
                              <span className="font-medium">{item.name}</span>
                              {item.submittedTime && (
                                <span className="text-[10px] text-slate-500 font-normal">({item.submittedTime})</span>
                              )}
                            </div>
                            <div className="flex items-center gap-4">
                              <span className={`text-xs ${subText}`}>⏱️ {item.timeSpent} វិនាទី</span>
                              <span className="font-black text-amber-400">
                                {item.score} <span className={`text-xs font-normal ${subText}`}>ពិន្ទុ</span>
                              </span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}

              {adminTab === "questions" && (
                <div className="max-w-5xl mx-auto w-full space-y-6">
                  <div className={`border p-5 rounded-3xl shadow-xl flex flex-wrap items-center justify-between gap-4 ${cardBg}`}>
                    <div className="flex-1 min-w-[280px]">
                      <label className="text-xs text-amber-400 font-bold block mb-1">🏷️ កែប្រែចំណងជើងកម្មវិធី៖</label>
                      <input
                        type="text"
                        value={appTitle}
                        onChange={(e) => handleTitleChange(e.target.value)}
                        className={`w-full border rounded-xl px-4 py-2.5 text-sm font-bold focus:outline-none focus:border-amber-400 ${inputBg}`}
                      />
                    </div>
                    <div className="flex flex-wrap items-center gap-2 pt-2">
                      <button
                        onClick={handleExportToWord}
                        className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition shadow flex items-center gap-1.5"
                      >
                        📄 ទាញយកជា Word
                      </button>
                      <button
                        onClick={() => setShowImportModal(true)}
                        className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition shadow-lg flex items-center gap-1.5"
                      >
                        ⚡ បញ្ចូលសំណួររហ័ស (Bulk)
                      </button>
                      <button
                        onClick={handleAddNewQuestion}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-2.5 rounded-xl text-xs font-bold transition"
                      >
                        ➕ ថែមសំណួរ
                      </button>
                      <button
                        onClick={handleSaveAndActivate}
                        className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow-lg flex items-center gap-1.5"
                      >
                        💾 រក្សាទុក និងផ្សាយ ({editingQuestions.length})
                      </button>
                    </div>
                  </div>

                  <div className="space-y-4">
                    {editingQuestions.map((q, qIdx) => (
                      <div key={q.id || qIdx} className={`border p-5 rounded-3xl shadow-xl space-y-4 ${cardBg}`}>
                        <div className="flex items-start justify-between gap-3">
                          <div className="flex-1 flex items-center gap-3">
                            <span className="bg-purple-950 text-purple-400 border border-purple-800 w-8 h-8 rounded-xl flex items-center justify-center font-bold text-sm shrink-0">
                              {qIdx + 1}
                            </span>
                            <textarea
                              rows="2"
                              value={q.question}
                              onChange={(e) => handleQuestionChange(qIdx, e.target.value)}
                              placeholder="វាយប្រធានសំណួរនៅទីនេះ..."
                              className={`w-full border rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-purple-500 ${inputBg}`}
                            />
                          </div>
                          <button
                            onClick={() => handleDeleteQuestion(qIdx)}
                            className="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 p-2.5 rounded-xl transition shrink-0"
                          >
                            🗑️
                          </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pl-0 md:pl-11">
                          {q.options.map((opt, optIdx) => (
                            <div
                              key={optIdx}
                              className={`flex items-center gap-2.5 border p-2.5 rounded-2xl ${
                                isDark ? "bg-slate-950 border-slate-800" : "bg-slate-50 border-slate-200"
                              }`}
                            >
                              <input
                                type="radio"
                                name={`correct-ans-${qIdx}`}
                                checked={q.answer === opt}
                                onChange={() => handleSetCorrectAnswer(qIdx, opt)}
                                className="accent-emerald-500 w-4 h-4 cursor-pointer shrink-0"
                              />
                              <input
                                type="text"
                                value={opt}
                                onChange={(e) => handleOptionChange(qIdx, optIdx, e.target.value)}
                                placeholder={`ជម្រើសទី ${optIdx + 1}`}
                                className={`w-full bg-transparent text-xs focus:outline-none ${
                                  q.answer === opt ? "text-emerald-500 font-bold" : ""
                                }`}
                              />
                              {q.answer === opt && (
                                <span className="text-emerald-500 text-xs font-bold pr-2 shrink-0">✓ ត្រូវ</span>
                              )}
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* MODAL ប្រវត្តិនៃការប្រកួត */}
              {showHistoryModal && (
                <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className={`max-w-3xl w-full rounded-3xl border p-6 shadow-2xl space-y-4 max-h-[85vh] flex flex-col ${cardBg}`}>
                    <div className="flex justify-between items-center border-b pb-3 border-slate-800">
                      <div>
                        <h3 className="text-lg font-bold text-cyan-400 flex items-center gap-2">
                          <span>📜</span>
                          <span>ប្រវត្តិនៃការប្រកួតកន្លងមក (Match History)</span>
                        </h3>
                        <p className={`text-xs ${subText}`}>ទិន្នន័យគ្រប់ជុំទាំងអស់ត្រូវបានរក្សាទុកដោយសុវត្ថិភាព</p>
                      </div>
                      <button onClick={() => setShowHistoryModal(false)} className="text-slate-400 hover:text-white text-lg font-bold">✕</button>
                    </div>

                    <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                      {historyList.length === 0 ? (
                        <p className={`text-center py-10 text-sm ${subText}`}>មិនទាន់មានប្រវត្តិប្រកួតដែលបាន Archive ទុកនៅឡើយទេ...</p>
                      ) : (
                        historyList.map((item, hIdx) => (
                          <div key={item.id} className={`p-4 rounded-2xl border ${isDark ? "bg-slate-950/70 border-slate-800" : "bg-slate-50 border-slate-200"} flex flex-wrap justify-between items-center gap-3`}>
                            <div>
                              <div className="font-bold text-sm text-amber-400">{item.title}</div>
                              <div className={`text-xs ${subText} mt-0.5`}>
                                📅 {item.date} • ម៉ោង {item.time} | 👥 សិស្សចូលរួម៖ <span className="font-bold text-white">{item.totalParticipants} នាក់</span>
                              </div>
                              <div className="text-xs text-emerald-400 font-medium mt-1">
                                🥇 ជើងឯកលេខ ១៖ {item.top1}
                              </div>
                            </div>
                            <div className="flex items-center gap-2">
                              <button
                                onClick={() => exportTableToExcel(item.data, `${item.title}_ជុំទី${historyList.length - hIdx}`, item.date)}
                                className="bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 border border-emerald-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1"
                              >
                                📊 ទាញយក Excel
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="flex justify-between items-center pt-3 border-t border-slate-800 text-xs">
                      <span className={subText}>សរុប {historyList.length} ជុំប្រកួត</span>
                      <button
                        onClick={() => setShowHistoryModal(false)}
                        className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700"
                      >
                        បិទផ្ទាំង
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL BULK IMPORT */}
              {showImportModal && (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className={`max-w-2xl w-full rounded-3xl border p-6 shadow-2xl space-y-4 ${cardBg}`}>
                    <div className="flex justify-between items-center border-b pb-3 border-slate-800">
                      <div>
                        <h3 className="text-lg font-bold text-amber-400">⚡ បញ្ចូលសំណួររហ័ស (Bulk Import)</h3>
                        <p className={`text-xs ${subText}`}>ចម្លងពី Word, Excel ឬ AI រួចបិទភ្ជាប់ (Paste) ចូលទីនេះភ្លាមៗ</p>
                      </div>
                      <button onClick={() => setShowImportModal(false)} className="text-slate-400 hover:text-white text-lg font-bold">✕</button>
                    </div>

                    <textarea
                      rows="8"
                      value={bulkText}
                      onChange={(e) => setBulkText(e.target.value)}
                      placeholder={`ឧទាហរណ៍ទម្រង់៖

សំណួរទី ១៖ តើព្យញ្ជនៈខ្មែរមានប៉ុន្មានតួ?
ក. ៣១ តួ
ខ. ៣២ តួ
គ. ៣៣ តួ
ឃ. ៣៤ តួ`}
                      className={`w-full border rounded-2xl p-4 text-xs focus:outline-none focus:border-indigo-500 font-mono leading-relaxed ${inputBg}`}
                    ></textarea>

                    <div className="flex justify-end gap-2">
                      <button
                        onClick={() => setShowImportModal(false)}
                        className="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300"
                      >
                        បោះបង់
                      </button>
                      <button
                        onClick={handleProcessBulkImport}
                        className="px-5 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white"
                      >
                        បំលែងចូលប្រព័ន្ធ 🚀
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL ប្តូរលេខសម្ងាត់ */}
              {showPinModal && (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className={`max-w-sm w-full rounded-3xl border p-6 shadow-2xl space-y-4 ${cardBg}`}>
                    <div className="flex justify-between items-center border-b pb-3 border-slate-800">
                      <h3 className="text-base font-bold text-amber-400 flex items-center gap-2">
                        <span>🔐</span>
                        <span>ប្តូរលេខសម្ងាត់គ្រូបង្រៀន</span>
                      </h3>
                      <button onClick={() => setShowPinModal(false)} className="text-slate-400 hover:text-white text-lg font-bold">✕</button>
                    </div>

                    <div className="space-y-3">
                      <div>
                        <label className="text-xs text-slate-300 block mb-1">លេខសម្ងាត់ចាស់៖</label>
                        <input
                          type="password"
                          placeholder="••••"
                          value={oldPinInput}
                          onChange={(e) => setOldPinInput(e.target.value)}
                          className={`w-full border rounded-xl p-2.5 text-xs focus:outline-none focus:border-purple-500 ${inputBg}`}
                        />
                      </div>
                      <div>
                        <label className="text-xs text-slate-300 block mb-1">លេខសម្ងាត់ថ្មី (យ៉ាងតិច ៤ ខ្ទង់)៖</label>
                        <input
                          type="password"
                          placeholder="••••"
                          value={newPinInput}
                          onChange={(e) => setNewPinInput(e.target.value)}
                          className={`w-full border rounded-xl p-2.5 text-xs focus:outline-none focus:border-purple-500 ${inputBg}`}
                        />
                      </div>
                      <div>
                        <label className="text-xs text-slate-300 block mb-1">ផ្ទៀងផ្ទាត់លេខសម្ងាត់ថ្មី៖</label>
                        <input
                          type="password"
                          placeholder="••••"
                          value={confirmPinInput}
                          onChange={(e) => setConfirmPinInput(e.target.value)}
                          className={`w-full border rounded-xl p-2.5 text-xs focus:outline-none focus:border-purple-500 ${inputBg}`}
                        />
                      </div>
                    </div>

                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        onClick={() => setShowPinModal(false)}
                        className="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300 hover:bg-slate-700"
                      >
                        បោះបង់
                      </button>
                      <button
                        onClick={handleChangePin}
                        className="px-5 py-2 rounded-xl text-xs font-bold bg-purple-600 hover:bg-purple-500 text-white shadow-lg"
                      >
                        រក្សាទុកលេខកូដ
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // =========================================================================
        // ផ្ទាំងសិស្សចូលលេង
        // =========================================================================
        return (
          <div className={`flex flex-col items-center justify-center min-h-screen p-3 sm:p-4 relative ${themeBg}`}>
            <div className="absolute top-3 right-3">
              <button
                onClick={() => { window.location.hash = "#admin"; setIsTeacher(true); }}
                className="text-[11px] bg-slate-800/60 hover:bg-slate-700/80 text-slate-400 border border-slate-700/70 px-3 py-1.5 rounded-xl transition flex items-center gap-1"
              >
                <span>🔑</span>
                <span>ផ្ទាំងគ្រូ</span>
              </button>
            </div>

            {!started ? (
              <div className={`p-6 sm:p-8 rounded-3xl border max-w-sm w-full text-center shadow-2xl relative ${cardBg}`}>
                <div className="text-5xl sm:text-6xl mb-3 animate-bounce">⚡</div>
                <h1 className="text-lg sm:text-2xl font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 leading-snug">
                  {appTitle}
                </h1>

                <div className="text-[11px] text-amber-400 font-medium mb-2">
                  📅 {liveDate.fullDate}
                </div>

                <p className={`text-xs mb-5 ${subText}`}>
                  ⏱️ ២០ វិនាទីក្នុង ១ សំណួរ | ឆ្លើយត្រូវ និងលឿនជាងគេដើម្បីបានពាន!
                </p>

                <input
                  type="text"
                  placeholder="វាយឈ្មោះរបស់អ្នក..."
                  value={userName}
                  onChange={(e) => setUserName(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && startStudentGame()}
                  className={`w-full border rounded-2xl p-3.5 text-center text-base sm:text-lg mb-4 focus:outline-none focus:border-purple-500 ${inputBg}`}
                />
                <button
                  onClick={startStudentGame}
                  disabled={!userName.trim()}
                  className={`w-full py-3.5 rounded-2xl font-bold transition shadow-lg text-sm sm:text-base ${
                    userName.trim() ? "bg-purple-600 hover:bg-purple-500 text-white shadow-purple-600/30 active:scale-95" : "bg-slate-800 text-slate-600 cursor-not-allowed"
                  }`}
                >
                  ចូលរួមប្រកួត 🚀
                </button>

                <div className="mt-6 pt-4 border-t border-slate-800/60 flex items-center justify-center gap-1.5 text-[11px] text-slate-400">
                  <span>បង្កើតឡើងដោយ៖</span>
                  <span className="font-bold text-amber-400">អ៊ាង យ៉ាឌីន ICTព្រៃវែង</span>
                </div>
              </div>
            ) : currentQ < shuffledQuestions.length ? (
              <div className="w-full max-w-lg flex flex-col gap-3">
                <div className={`flex justify-between items-center border px-4 py-2.5 rounded-2xl ${cardBg}`}>
                  <span className="text-[11px] font-bold bg-purple-950 text-purple-300 border border-purple-800 px-3 py-1 rounded-full">
                    {currentQ + 1} / {shuffledQuestions.length}
                  </span>

                  <div className={`flex items-center gap-1 font-black text-base ${timeLeft <= 5 ? "timer-warn" : "text-amber-400"}`}>
                    <span>⏱️</span>
                    <span>{timeLeft}s</span>
                  </div>

                  <span className="text-xs font-semibold truncate max-w-[110px]">👤 {userName}</span>
                </div>

                <div className={`border p-5 sm:p-6 rounded-3xl text-center shadow-xl min-h-[110px] flex items-center justify-center ${cardBg}`}>
                  <h2 className="text-base sm:text-lg font-bold leading-relaxed">
                    {shuffledQuestions[currentQ].question}
                  </h2>
                </div>

                <div className="grid grid-cols-1 gap-2.5 sm:gap-3">
                  {shuffledQuestions[currentQ].options.map((opt, index) => {
                    const color = kahootColors[index % 4];
                    let extraStyle = `${color.bg} ${color.border} text-white`;

                    if (answered) {
                      if (opt === shuffledQuestions[currentQ].answer) {
                        extraStyle = "bg-emerald-500 border-emerald-400 ring-4 ring-emerald-300 text-white scale-[1.01]";
                      } else if (selectedOpt === opt) {
                        extraStyle = "bg-rose-700 border-rose-600 opacity-60 text-white";
                      } else {
                        extraStyle = "opacity-30 bg-slate-800 border-slate-700";
                      }
                    }

                    return (
                      <button
                        key={index}
                        onClick={() => handleAnswer(opt)}
                        disabled={answered}
                        className={`p-4 sm:p-4.5 rounded-2xl border-b-4 font-bold text-sm sm:text-base flex items-center gap-3 transition-all active:scale-95 shadow-md text-left ${extraStyle}`}
                      >
                        <span className="text-lg opacity-80 shrink-0">{color.shape}</span>
                        <span className="flex-1 leading-snug">{opt}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            ) : (
              <div className={`border p-6 sm:p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl ${cardBg}`}>
                <div className="text-6xl mb-2 animate-pulse">🏆</div>
                <h2 className="text-xl font-black mb-1">អបអរសាទរ {userName}!</h2>
                <p className={`text-xs mb-4 ${subText}`}>អ្នកបានឆ្លើយចប់សំណួរទាំងអស់</p>

                <div className={`border p-4 rounded-2xl mb-4 ${isDark ? "bg-slate-950 border-slate-800" : "bg-slate-50 border-slate-200"}`}>
                  <span className={`text-[11px] uppercase tracking-widest font-bold ${subText}`}>ពិន្ទុទទួលបាន</span>
                  <div className="text-3xl font-black text-amber-400 my-1">
                    {score} <span className={`text-sm font-normal ${subText}`}>ពិន្ទុ</span>
                  </div>
                  <span className="text-xs text-purple-400">⏱️ ប្រើពេលសរុប៖ {totalTimeSpent} វិនាទី</span>
                </div>

                <div className="p-3 bg-purple-950/40 border border-purple-800/50 rounded-xl text-xs text-purple-300 leading-relaxed">
                  📢 លទ្ធផលត្រូវបានបញ្ជូនទៅផ្ទាំងធំ (Podium) របស់គ្រូរួចរាល់ហើយ!
                </div>

                <div className="mt-5 pt-3 border-t border-slate-800/50 text-[11px] text-slate-500">
                  កម្មវិធីរៀបចំដោយ៖ <span className="font-bold text-amber-400">អ៊ាង យ៉ាឌីន ICTព្រៃវែង</span>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
